services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medilink_api
    env_file:
      - .env.docker
    environment:
      NODE_ENV: development
      PORT: 4000
      DB_HOST: host.docker.internal
      DB_PORT: "5433"
    ports:
      - "4000:4000"
    volumes:
      - ./:/app
      - /app/node_modules
    command: sh ./docker-entrypoint.sh

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: medilink_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@medilink.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  web:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: medilink_web
    environment:
      VITE_API_BASE_URL: http://localhost:4000
      #VITE_API_BASE_URL: http://10.0.0.203:4000
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ../:/app
      - /app/node_modules
    depends_on:
      - api
    command: sh -c "npm run dev -- --host 0.0.0.0 --port 5173"

  provider_web:
    build:
      context: ../provider-ui
      dockerfile: Dockerfile
    container_name: medilink_provider_web
    environment:
      VITE_API_BASE_URL: http://localhost:4000
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5174:5174"
    volumes:
      - ../provider-ui:/app
      - /app/node_modules
    depends_on:
      - api
    command: sh -c "npm run dev -- --host 0.0.0.0 --port 5174"

volumes:
  pgadmin_data:
