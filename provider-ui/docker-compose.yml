services:
  provider_web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medilink_provider_web
    environment:
      VITE_API_BASE_URL: http://localhost:4000
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5174:5174"
    volumes:
      - ./:/app
      - /app/node_modules
    command: sh -c "npm run dev -- --host 0.0.0.0 --port 5174"
